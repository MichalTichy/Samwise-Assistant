name: samwise

services:
  gateway-runner-image:
    image: ${CODEX_GATEWAY_RUNNER_IMAGE:-registry.tichymichal.net/codex-gateway-runner:latest}
    entrypoint: ["/bin/true"]
    restart: "no"

  mail-calendar-contacts-mcp:
    image: ${MAIL_CALENDAR_CONTACTS_IMAGE:-registry.tichymichal.net/mcp-mail-calendar-contacts:latest}
    restart: unless-stopped
    ports:
      - "${MAIL_CALENDAR_CONTACTS_BIND_ADDRESS:-0.0.0.0}:${MAIL_CALENDAR_CONTACTS_PORT:-5051}:8080"
    environment:
      CALENDAR_MCP_ADMIN_TOKEN: "${MAIL_CALENDAR_CONTACTS_MCP_ADMIN_TOKEN:?Set MAIL_CALENDAR_CONTACTS_MCP_ADMIN_TOKEN in an ignored .env file}"
      CALENDAR_MCP_CalendarMcp__Mcp__RequireApiKey: "false"
      CALENDAR_MCP_CalendarMcp__ExternalBaseUrl: "${MAIL_CALENDAR_CONTACTS_MCP_EXTERNAL_URL:-http://localhost:5051}"
      CALENDAR_MCP_CalendarMcp__AgentFileOrigin: http://gateway:8080
    volumes:
      - mail-calendar-contacts-data:/app/data
    networks:
      - gateway-backend

  todoist-mcp:
    image: ${TODOIST_MCP_RUNTIME_IMAGE:-node:latest}
    restart: unless-stopped
    user: node
    command:
      - npx
      - --yes
      - --package=@doist/todoist-mcp@latest
      - todoist-mcp-http
    environment:
      TODOIST_API_KEY: "${TODOIST_API_KEY:?Set TODOIST_API_KEY in an ignored .env file}"
      HOST: 0.0.0.0
      PORT: "8080"
      ALLOWED_HOSTS: todoist-mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - gateway-backend

  riganti-is-mcp:
    image: ${RIGANTI_IS_MCP_IMAGE:-registry.tichymichal.net/mcp-riganti-is:latest}
    restart: unless-stopped
    environment:
      RIGANTI_IS_BEARER_TOKEN: "${RIGANTI_IS_BEARER_TOKEN:?Set RIGANTI_IS_BEARER_TOKEN in the Portainer stack environment}"
    healthcheck:
      test: ["CMD", "dotnet", "/app/Riganti.IsMcp.Http.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    networks:
      - gateway-backend

  toggl-mcp:
    image: ${TOGGL_MCP_IMAGE:-registry.tichymichal.net/mcp-toggl-track:latest}
    restart: unless-stopped
    environment:
      TOGGL_TRACK_API_KEY: "${TOGGL_TRACK_API_KEY:?Set TOGGL_TRACK_API_KEY in the Portainer stack environment}"
      TOGGL_TRACK_ORGANIZATION_ID: "${TOGGL_TRACK_ORGANIZATION_ID:-}"
      TOGGL_TRACK_WORKSPACE_ID: "${TOGGL_TRACK_WORKSPACE_ID:?Set TOGGL_TRACK_WORKSPACE_ID in the Portainer stack environment}"
      TOGGL_TRACK_API_MODE: "${TOGGL_TRACK_API_MODE:-auto}"
      TOGGL_TRACK_BASE_URL: "${TOGGL_TRACK_BASE_URL:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks:
      - gateway-backend

  teams-mcp:
    image: ${TEAMS_MCP_IMAGE:-registry.tichymichal.net/mcp-teams:latest}
    restart: unless-stopped
    ports:
      - "${TEAMS_MCP_BIND_ADDRESS:-0.0.0.0}:${TEAMS_MCP_PORT:-5052}:8080"
    environment:
      TeamsMcp__TenantId: "${TEAMS_MCP_TENANT_ID:?Set TEAMS_MCP_TENANT_ID in an ignored .env file}"
      TeamsMcp__ClientId: "${TEAMS_MCP_CLIENT_ID:?Set TEAMS_MCP_CLIENT_ID in an ignored .env file}"
      TeamsMcp__ClientSecret: "${TEAMS_MCP_CLIENT_SECRET:-}"
      TeamsMcp__AdminPassword: "${TEAMS_MCP_ADMIN_PASSWORD:?Set TEAMS_MCP_ADMIN_PASSWORD in an ignored .env file}"
      TeamsMcp__DataPath: /app/data
    volumes:
      - teams-data:/app/data
    networks:
      - gateway-backend

  gateway:
    image: ${CODEX_GATEWAY_IMAGE:-registry.tichymichal.net/codex-gateway:latest}
    restart: unless-stopped
    depends_on:
      gateway-runner-image:
        condition: service_completed_successfully
      mail-calendar-contacts-mcp:
        condition: service_started
      teams-mcp:
        condition: service_started
      todoist-mcp:
        condition: service_healthy
      riganti-is-mcp:
        condition: service_healthy
      toggl-mcp:
        condition: service_healthy
    ports:
      - "${CODEX_GATEWAY_BIND_ADDRESS:-0.0.0.0}:${CODEX_GATEWAY_PORT:-5050}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AdminUi__Username: "${CODEX_GATEWAY_ADMIN_USERNAME:?Set CODEX_GATEWAY_ADMIN_USERNAME in an ignored .env file}"
      AdminUi__Password: "${CODEX_GATEWAY_ADMIN_PASSWORD:?Set CODEX_GATEWAY_ADMIN_PASSWORD in an ignored .env file}"
      ConnectionStrings__Gateway: "${CODEX_GATEWAY_CONNECTION_STRING:?Set CODEX_GATEWAY_CONNECTION_STRING in an ignored .env file}"
      SAMWISE_MCP_API_KEY: "${SAMWISE_MCP_API_KEY:?Set SAMWISE_MCP_API_KEY in an ignored .env file}"
      WALLET_MCP_AUTHORIZATION: "Bearer ${WALLET_MCP_ACCESS_TOKEN:?Set WALLET_MCP_ACCESS_TOKEN in the Portainer stack environment}"
      Codex__Container__EngineExecutablePath: docker
      Codex__Container__Image: "${CODEX_GATEWAY_RUNNER_IMAGE:-registry.tichymichal.net/codex-gateway-runner:latest}"
      Codex__Container__WorkspaceVolume: "${CODEX_GATEWAY_DATA_VOLUME:-codex-gateway-data}"
      Codex__Container__AuthVolume: "${CODEX_GATEWAY_AUTH_VOLUME:-codex-gateway-auth}"
      Codex__Container__Network: "${CODEX_GATEWAY_RUNNER_NETWORK:-codex-gateway-runner}"
      Codex__Container__AppArmorProfile: "${CODEX_RUNNER_APPARMOR_PROFILE:-}"
      Codex__Container__MemoryMegabytes: "${CODEX_RUNNER_MEMORY_MB:-2048}"
      Codex__Container__CpuLimit: "${CODEX_RUNNER_CPU_LIMIT:-2}"
      Codex__Container__PidsLimit: "${CODEX_RUNNER_PIDS_LIMIT:-256}"
      Codex__Container__TmpfsMegabytes: "${CODEX_RUNNER_TMPFS_MB:-256}"
      McpGateway__RunnerBaseUrl: http://gateway:8080
    volumes:
      - gateway-data:/app/data
      - codex-home:/app/.codex-home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 24
    networks:
      - default
      - runner
      - gateway-backend

  web:
    image: ${SAMWISE_IMAGE:-registry.tichymichal.net/samwise-assistant:latest}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${SAMWISE_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AllowedHosts: "${SAMWISE_ALLOWED_HOSTS:-*}"
      ConnectionStrings__samwise: "${SAMWISE_CONNECTION_STRING:?Set SAMWISE_CONNECTION_STRING in an ignored .env file}"
      DataProtection__KeysPath: /app/data-protection
      Authentication__RequireHttps: "${SAMWISE_REQUIRE_HTTPS:-false}"
      OwnerAccount__Email: "${SAMWISE_OWNER_EMAIL:?Set SAMWISE_OWNER_EMAIL in an ignored .env file}"
      OwnerAccount__InitialPassword: "${SAMWISE_OWNER_INITIAL_PASSWORD:-}"
      AgentEndpoints__Intake__BaseAddress: "${SAMWISE_INTAKE_BASE_URL:-http://gateway:8080/v1/}"
      AgentEndpoints__Intake__ApiKey: "${SAMWISE_INTAKE_API_KEY:?Set SAMWISE_INTAKE_API_KEY in an ignored .env file}"
      AgentEndpoints__Planning__BaseAddress: "${SAMWISE_PLANNING_BASE_URL:-http://gateway:8080/p/samwise-planning/v1/}"
      AgentEndpoints__Planning__ApiKey: "${SAMWISE_PLANNING_API_KEY:?Set SAMWISE_PLANNING_API_KEY in an ignored .env file}"
      AgentEndpoints__Execution__BaseAddress: "${SAMWISE_EXECUTION_BASE_URL:-http://gateway:8080/p/samwise-execution/v1/}"
      AgentEndpoints__Execution__ApiKey: "${SAMWISE_EXECUTION_API_KEY:?Set SAMWISE_EXECUTION_API_KEY in an ignored .env file}"
      AgentEndpoints__AutomaticApproval__BaseAddress: "${SAMWISE_AUTO_APPROVAL_BASE_URL:-http://gateway:8080/p/samwise-auto-approval/v1/}"
      AgentEndpoints__AutomaticApproval__ApiKey: "${SAMWISE_AUTO_APPROVAL_API_KEY:-}"
      AgentEndpoints__AutoApprovedExecution__BaseAddress: "${SAMWISE_AUTO_EXECUTION_BASE_URL:-http://gateway:8080/p/samwise-auto-execution/v1/}"
      AgentEndpoints__AutoApprovedExecution__ApiKey: "${SAMWISE_AUTO_EXECUTION_API_KEY:-}"
      SamwiseMcp__ApiKey: "${SAMWISE_MCP_API_KEY:?Set SAMWISE_MCP_API_KEY in an ignored .env file}"
      ManualInputApi__ApiKey: "${SAMWISE_MANUAL_INPUT_API_KEY:?Set SAMWISE_MANUAL_INPUT_API_KEY in an ignored .env file}"
      Email__Microsoft365__ClientId: "${SAMWISE_MICROSOFT365_CLIENT_ID:-}"
      Email__Microsoft365__TenantId: "${SAMWISE_MICROSOFT365_TENANT_ID:-organizations}"
      WebPush__Subject: "${SAMWISE_WEB_PUSH_SUBJECT:-}"
    volumes:
      - data-protection-keys:/app/data-protection
    networks:
      - default
      - gateway-backend

volumes:
  data-protection-keys:
  mail-calendar-contacts-data:
    name: ${MAIL_CALENDAR_CONTACTS_DATA_VOLUME:-mcp-mail-calendar-contacts-data}
  teams-data:
    name: ${TEAMS_MCP_DATA_VOLUME:-mcp-teams-data}
  gateway-data:
    name: ${CODEX_GATEWAY_DATA_VOLUME:-codex-gateway-data}
  codex-home:
    name: ${CODEX_GATEWAY_AUTH_VOLUME:-codex-gateway-auth}

networks:
  runner:
    name: ${CODEX_GATEWAY_RUNNER_NETWORK:-codex-gateway-runner}
  gateway-backend:
    name: ${CODEX_GATEWAY_BACKEND_NETWORK:-codex-gateway-backend}
